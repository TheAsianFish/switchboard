# Prometheus in compose: scrapes each gateway's admin listener (/metrics on
# :9090 inside the compose network). The replicas are found by DNS, so only
# those of the running profile (switchboard for dev, switchboard-1..3 for
# the fleet) become targets; a replica that is killed drops out until it is
# back. The instance label is the service name.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: switchboard
    metrics_path: /metrics
    dns_sd_configs:
      - names: [switchboard, switchboard-1, switchboard-2, switchboard-3]
        type: A
        port: 9090
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: instance
