# Round-robin load balancer for the three-replica fleet (make fleet).
worker_processes auto;
events {
    worker_connections 4096;
}
http {
    access_log off;
    upstream switchboard {
        server switchboard-1:8080;
        server switchboard-2:8080;
        server switchboard-3:8080;
        keepalive 128;
    }
    server {
        listen 8080;
        client_max_body_size 32m;
        location / {
            proxy_pass http://switchboard;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Streams go out token by token, not when a buffer fills.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
