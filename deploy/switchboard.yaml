# Switchboard configuration. The container image ships this file; mount your own over it.
# SWITCHBOARD_* environment variables override these settings; provider
# secrets are only ever read from the environment variable named here.

listen: 0.0.0.0:8080
admin_listen: 127.0.0.1:9090   # compose sets SWITCHBOARD_ADMIN_LISTEN for the replicas
log:
  format: json
  level: info

providers:
  # Ollama's OpenAI-compatible endpoint (also vLLM, llama.cpp, ...).
  - name: ollama
    type: openaicompat
    base_url: http://ollama:11434/v1
    timeout: 5m
  # The Anthropic API through the official Go SDK.
  - name: anthropic
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    default_max_tokens: 4096   # sent when an OpenAI-format client omits max_tokens
    timeout: 10m
  # A deterministic backend for trying the gateway without any model.
  - name: fake
    type: fake

# Limits and budgets are shared through Redis when redis.url is set (compose
# sets SWITCHBOARD_REDIS_URL); without it they are per process.
redis:
  url: ""
  timeout: 100ms
ratelimit:
  algorithm: fixed_window   # or gcra
  replicas: 1               # while Redis is down each replica enforces 1/replicas of every limit
budget:
  grace_usd: 0.10           # per replica and key while Redis is down

# Response cache. A request is cached only when it asks for deterministic
# output (temperature at most max_temperature) or sends the header
# X-Switchboard-Cache: exact|semantic|off. The semantic layer serves a
# stored reply to a reworded last turn, only within the same tenant, model,
# system prompt, earlier turns and sampling parameters. Entries live in
# Redis when redis.url is set, so every replica sees them.
cache:
  mode: exact              # default for keys: off, exact or semantic
  ttl: 24h
  max_temperature: 0
  semantic:
    embed_url: http://ollama:11434   # Ollama, without /v1
    model: all-minilm

models:
  # Prices are dollars per million tokens. Claude models fall back to the
  # built-in list prices; a model with no price is not counted in spend and
  # keys with a budget may not use it.
  - name: qwen2.5:0.5b
    provider: ollama
    price: {input: 0, output: 0}
  - name: claude-haiku-5-5
    provider: anthropic
  - name: claude-opus-5-5
    provider: anthropic
  - name: fake
    provider: fake
    price: {input: 0, output: 0}

keys:
  # The image listens on 0.0.0.0 and this key is printed in the README, so it
  # only reaches the free local models. To use Claude, mount a config with a
  # key of your own, stored as its hex digest: printf %s "$KEY" | sha256sum
  #   - name: me
  #     sha256: <digest>
  - name: dev
    key: sk-switchboard-dev
    models: [qwen2.5:0.5b, fake]
