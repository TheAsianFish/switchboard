# Switchboard in compose.
#
#   make dev     one replica, Redis, Ollama and the fake provider (profile dev)
#   make fleet   three replicas behind an nginx load balancer, sharing
#                limits and budgets through Redis (profile fleet)
#
# The API is on http://localhost:8080 either way. Each replica's admin
# listener (the admin page at /, its API at /api/overview, /metrics) is
# published on loopback: 9090 for the dev replica, 9091-9093 for the
# fleet; any fleet replica's page shows all three. Both profiles also run Jaeger, which the gateways
# send their traces to (UI on http://localhost:16686; every response carries
# its trace id in X-Trace-Id), and Prometheus, which scrapes every replica
# (UI on http://localhost:9095).
name: switchboard

x-gateway: &gateway
  build: ..
  image: switchboard:dev
  depends_on: [redis, jaeger]
  restart: unless-stopped
  environment: &gateway-env
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    SWITCHBOARD_LOG_FORMAT: text
    SWITCHBOARD_REDIS_URL: redis://redis:6379/0
    SWITCHBOARD_ADMIN_LISTEN: 0.0.0.0:9090
    SWITCHBOARD_PROVIDER_OLLAMA_BASE_URL: http://ollama:11434/v1
    # The semantic cache embeds prompts with the same Ollama (pull
    # nomic-embed-text into it first).
    SWITCHBOARD_CACHE_EMBED_URL: http://ollama:11434
    SWITCHBOARD_TRACING_ENDPOINT: http://jaeger:4318
    # The admin page links each request to its trace in Jaeger's UI.
    SWITCHBOARD_ADMIN_TRACE_URL: http://localhost:16686/trace/{trace_id}

x-replica-env: &replica-env
  <<: *gateway-env
  # While Redis is unreachable each replica enforces a third of every
  # limit on its own.
  SWITCHBOARD_RATELIMIT_REPLICAS: "3"

services:
  redis:
    image: redis:8
    # No persistence: limits and budgets live in memory, so killing Redis
    # loses them. The degrade policy and Q2's outage run are about exactly
    # that case.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

  switchboard:
    <<: *gateway
    profiles: [dev]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"

  switchboard-1:
    <<: *gateway
    profiles: [fleet]
    environment:
      <<: *replica-env
      SWITCHBOARD_REPLICA_ID: switchboard-1
    ports: ["127.0.0.1:9091:9090"]
  switchboard-2:
    <<: *gateway
    profiles: [fleet]
    environment:
      <<: *replica-env
      SWITCHBOARD_REPLICA_ID: switchboard-2
    ports: ["127.0.0.1:9092:9090"]
  switchboard-3:
    <<: *gateway
    profiles: [fleet]
    environment:
      <<: *replica-env
      SWITCHBOARD_REPLICA_ID: switchboard-3
    ports: ["127.0.0.1:9093:9090"]

  lb:
    image: nginx:1.29-alpine
    profiles: [fleet]
    depends_on: [switchboard-1, switchboard-2, switchboard-3]
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080"

  # The deterministic backend as its own process, with a ledger of every
  # request it received at /ledger.
  fake-provider:
    image: switchboard:dev
    build: ..
    profiles: [dev, fleet]
    command: ["fake-provider", "--listen", "0.0.0.0:9101"]
    ports:
      - "127.0.0.1:9101:9101"

  # Traces: the gateways export OTLP over HTTP to 4318; the UI and its
  # HTTP API (/api/traces/<id>, which scripts/trace-check.sh reads) are on
  # 16686. 4318 is published too, so a gateway run with `go run` on the
  # host can send to it. Spans live in memory and go with the container.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [dev, fleet]
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  # Metrics: scrapes each replica's admin listener (deploy/prometheus.yml).
  # 9090-9093 are the replicas' own /metrics on the host, so the UI is on
  # 9095.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [dev, fleet]
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9095:9090"

  ollama:
    image: ollama/ollama:latest
    profiles: [dev, fleet]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
