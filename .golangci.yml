version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  settings:
    misspell:
      locale: UK
      ignore-rules:
        # Wire-format and stdlib identifiers spelled the US way.
        - serialize
        - marshaling
        - canceled
    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: receiver-naming
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [noctx, bodyclose, revive]

formatters:
  enable:
    - gofmt
