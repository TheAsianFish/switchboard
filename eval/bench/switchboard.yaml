# Gateway config for `make bench` (Q1). The fake provider runs as its own
# process on 127.0.0.1:9101 and the gateway reaches it the way it reaches
# Ollama, through the OpenAI-compatible provider.
listen: 127.0.0.1:8080
log:
  format: json
  level: info
providers:
  - name: fake
    type: openaicompat
    base_url: http://127.0.0.1:9101/v1
    timeout: 30s
models:
  - name: fake
    provider: fake
keys:
  - name: bench
    key: sk-bench
