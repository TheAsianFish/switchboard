# Gateway config for `scripts/trace-check.sh --local`: every pipeline stage
# switched on (a request limit, a budget and the exact cache), the fake
# provider as its own process on 127.0.0.1:9101 reached through the
# OpenAI-compatible provider, and spans sent to Jaeger on localhost:4318.
listen: 127.0.0.1:8080
admin_listen: 127.0.0.1:9090
log:
  format: json
  level: info
tracing:
  endpoint: http://localhost:4318
providers:
  - name: fake
    type: openaicompat
    base_url: http://127.0.0.1:9101/v1
    timeout: 30s
cache:
  mode: exact
models:
  - name: fake
    provider: fake
    price: {input: 1, output: 2}
keys:
  - name: trace
    key: sk-trace
    limits:
      requests: {rate: 100, per: 1m, burst: 100}
    budget: {usd: 1, period: total}
