# Gateway config for `make bench-hedge` (Q4), hedging off. The fake
# provider runs as its own process on 127.0.0.1:9101 with a log-normal
# first-byte delay and a slow tail; the gateway reaches it through the
# OpenAI-compatible provider, as it reaches Ollama.
listen: 127.0.0.1:8080
admin_listen: 127.0.0.1:9190
log:
  format: json
  level: warn
providers:
  - name: fake
    type: openaicompat
    base_url: http://127.0.0.1:9101/v1
    timeout: 30s
    resilience:
      hedge: {enabled: false}
models:
  - name: fake
    provider: fake
keys:
  - name: bench
    key: sk-bench
