# Q1 gateway config "none", generated by eval/bench/q1.sh.
# Features on: none.
listen: 127.0.0.1:18080
admin_listen: 127.0.0.1:19090
log:
  format: json
  level: info
providers:
  # The fake provider runs as its own process and is reached the way the
  # gateway reaches Ollama, through the OpenAI-compatible provider.
  - name: fake
    type: openaicompat
    base_url: http://127.0.0.1:19101/v1
    timeout: 30s
models:
  - name: fake
    provider: fake
keys:
  - name: bench
    key: sk-bench
    cache: "off"
