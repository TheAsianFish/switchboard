name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt
      - name: go vet
        run: make vet
      # Built from source with the module's Go: a prebuilt golangci-lint
      # compiled with an older Go refuses to lint a go 1.27 module.
      - uses: actions/cache@v6
        with:
          path: bin
          key: golangci-${{ runner.os }}-${{ hashFiles('go.mod', 'Makefile') }}
      - name: golangci-lint
        run: |
          test -x bin/golangci-lint || make tools
          make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        run: make test
      - name: build
        run: make build

  # No service container: make test-integration starts its own redis:8
  # containers through scripts/with-redis.sh, a shared one and one started
  # with --enable-debug-command yes for the LOADING tests (a service
  # container cannot be given server arguments, and a DEBUG RELOAD on the
  # shared server would fail the other packages' tests running alongside).
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -tags integration (real redis:8)
        run: make test-integration

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: typecheck, lint, test, build, check the committed build
        run: make ui-check
