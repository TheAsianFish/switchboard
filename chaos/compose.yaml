# The chaos fleet (`make chaos`, PLAN.md Q6): three gateway replicas
# behind nginx, Redis 8 and the fake provider with its ledger. A project
# of its own, so it runs beside `make dev`/`make fleet` and the Q1 bench:
# every port is published on loopback only, on ports those do not use.
#
#   load balancer         127.0.0.1:28080
#   fake provider         127.0.0.1:29101 (/ledger)
#   replica admin (1..3)  127.0.0.1:29091-29093 (/metrics)
#
# chaos/run.sh kills and restarts replica 2 and Redis with `docker
# compose kill` / `start`, so nothing here restarts on its own.
name: switchboard-chaos

x-replica: &replica
  build: ..
  image: switchboard:dev
  depends_on: [redis, fake-provider]
  restart: "no"
  volumes:
    - ./switchboard.yaml:/etc/switchboard/chaos/switchboard.yaml:ro

x-replica-env: &replica-env
  SWITCHBOARD_CONFIG: /etc/switchboard/chaos/switchboard.yaml
  SWITCHBOARD_REDIS_URL: redis://redis:6379/0
  SWITCHBOARD_ADMIN_LISTEN: 0.0.0.0:9090
  SWITCHBOARD_LOG_FORMAT: json

services:
  redis:
    image: redis:8
    # No persistence, as in deploy/compose.yaml: a killed Redis comes back
    # empty, without the cache, the limit counters or the budget ledger.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: "no"

  fake-provider:
    image: switchboard:dev
    build: ..
    command: ["fake-provider", "--listen", "0.0.0.0:9101"]
    restart: "no"
    ports:
      - "127.0.0.1:29101:9101"

  switchboard-1:
    <<: *replica
    hostname: switchboard-1
    environment:
      <<: *replica-env
      SWITCHBOARD_REPLICA_ID: switchboard-1
    ports: ["127.0.0.1:29091:9090"]
  switchboard-2:
    <<: *replica
    hostname: switchboard-2
    environment:
      <<: *replica-env
      SWITCHBOARD_REPLICA_ID: switchboard-2
    ports: ["127.0.0.1:29092:9090"]
  switchboard-3:
    <<: *replica
    hostname: switchboard-3
    environment:
      <<: *replica-env
      SWITCHBOARD_REPLICA_ID: switchboard-3
    ports: ["127.0.0.1:29093:9090"]

  lb:
    image: nginx:1.29-alpine
    depends_on: [switchboard-1, switchboard-2, switchboard-3]
    restart: "no"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:28080:8080"
