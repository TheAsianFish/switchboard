# Load balancer for the chaos run: deploy/nginx.conf plus what a fleet
# that loses a replica needs.
#
# - Docker's DNS (127.0.0.11) is re-read every second and each upstream
#   server has `resolve`: a killed replica drops out of the group when its
#   name stops resolving, and a restarted one comes back even if Docker
#   gives it a new address. Without it nginx keeps the addresses it saw
#   at start.
# - A request whose connection to a replica fails, or does not connect
#   within 250 ms, goes to the next replica (`proxy_next_upstream error
#   timeout`), and one failure takes the replica out for 2 s.
# - A request is not retried once it was sent to a replica (nginx's
#   default for POST; `non_idempotent` is deliberately not set): the
#   replica may already have called the provider, so a retry could pay
#   for the same completion twice and bypass the limit it was counted
#   against. Requests in flight on a replica that dies fail with a 502;
#   the client decides whether to retry.
worker_processes auto;
events {
    worker_connections 4096;
}
http {
    access_log off;
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 1s;
    upstream switchboard {
        zone switchboard 64k;
        server switchboard-1:8080 resolve max_fails=1 fail_timeout=2s;
        server switchboard-2:8080 resolve max_fails=1 fail_timeout=2s;
        server switchboard-3:8080 resolve max_fails=1 fail_timeout=2s;
        keepalive 128;
    }
    server {
        listen 8080;
        client_max_body_size 32m;
        location / {
            proxy_pass http://switchboard;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 250ms;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;
            # Streams go out token by token, not when a buffer fills.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
